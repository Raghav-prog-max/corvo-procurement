:100%;margin-top:10px}.activity{margin-top:24px}.activitylist{padding:6px 22px 15px}.activityitem{padding:12px 0;border-bottom:1px solid #f0f2eb;display:flex;gap:10px;font-size:11px}.activityitem small{display:block;color:#99a28e;margin-top:5px;font-size:10px}.dot{width:7px;height:7px;flex-shrink:0;background:#a4b98a;border-radius:100%;margin-top:4px}.empty{text-align:center;padding:60px 25px;color:#8b9881;white-space:normal}.empty h3{color:#47603e;font:600 18px Manrope}.empty p{max-width:350px;margin:10px auto 20px;font-size:12px}.bodypad{padding:24px}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.upload{border:1px dashed #bdcbaa;border-radius:9px;padding:30px;background:#fbfcf8;text-align:center;margin:15px 0}.upload input{max-width:100%}.data-count{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.data-count div{background:#f4f6ef;padding:18px;border-radius:7px}.data-count b{display:block;font-size:23px;margin-bottom:5px}.data-count small{color:#8a9581;font-size:10px}.chat-shell{max-width:850px;margin:auto}.messages{min-height:350px;max-height:540px;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px}.message{max-width:80%;padding:14px 18px;border-radius:10px;background:#f1f5e9;line-height:1.7;font-size:13px;white-space:pre-wrap}.message.user{align-self:flex-end;background:var(--green);color:white}.chat-input{display:flex;gap:10px;padding:20px;border-top:1px solid var(--line)}.chat-input input{flex:1;min-width:0}.hint{font-size:11px;color:#8a987e;padding:0 22px 20px}.notice{background:#f0f4e8;border:1px solid #dce5cd;padding:14px 18px;border-radius:8px;color:#6d8056;font-size:12px;margin-bottom:20px}.editor{font:12px/1.65 Consolas,monospace;min-height:380px}.versions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.version{padding:12px;background:#f2f5ec;border-radius:7px;font-size:11px}.version b{display:block;margin-bottom:5px}.hidden{display:none!important}.toast{position:fixed;bottom:26px;left:5 </style></head><body>
<aside><div class="brand"><div class="mark">c</div>corvo<span style="color:#8daa69">.</span></div><div class="company"><div class="avatar">CE</div><div><b>Corvo Engineering</b><small>Procurement workspace</small></div></div><div class="navlabel">WORKSPACE</div><nav id="nav"><button data-page="workspace" class="active"><span>▦</span>Buyer workspace</button><button data-page="chat"><span>☷</span>New request</button><button data-page="suppliers"><span>♧</span>Preferred suppliers</button><button data-page="policy"><span>▤</span>Policy center</button><button data-page="data"><span>▱</span>Data library</button><button data-page="audit"><span>◷</span>Activity log</button></nav><div class="sidebar-bottom"><span class="live-dot"></span>Connected workspace<div class="profile"><div class="avatar">WO</div><div><b>Workspace owner</b><small>Procurement · owner access</small></div></div></div></aside>
<main><header><div class="crumb">Workspace <span style="margin:0 10px">/</span><b id="crumb">Buyer workspace</b></div><div class="top-actions"><span id="today"></span><span class="pill" id="policyPill">Policy v5.0 active</span><div class="avatar" style="border-radius:50%">WO</div></div></header><div id="content"></div><footer><span>CORVO ENGINEERING · PROCUREMENT</span><span>Every decision, accounted for.</span></footer></main><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div>
<script type="module">
let state={},page='workspace',selectedRun='',filter='all',query='',chatDraft={},draftContract=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const labels={workspace:'Buyer workspace',chat:'New request',suppliers:'Preferred suppliers',policy:'Policy center',data:'Data library',audit:'Activity log'};
function toast(t,error=false){$('#toast').textContent=t;$('#toast').className='toast'+(error?' error':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),7000)}
async function api(path,body){const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function refresh(){state=await api('state');render()}
function run(){return state.runs?.find(r=>r.id===selectedRun)||state.runs?.at(-1)}
function heading(title,sub,actions=''){return `<div class="heading"><div><div class="eyebrow">PROCUREMENT, SIMPLIFIED</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="heading-actions">${actions}</div></div>`}
function badge(route){return `<span class="badge ${/RFQ|RFP|SOURCING/.test(route)?'amber':/EMERGENCY/.test(route)?'blue':''}">${esc(route?.replaceAll('_',' '))}</span>`}
function change(p){page=p;render()}
function render(){if(!state.data)return;$('#crumb').textContent=labels[page];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const active=[...state.policies].filter(p=>p.effective_date<=new Date().toISOString().slice(0,10)).sort((a,b)=>b.effective_date.localeCompare(a.effective_date)||b.activated_at.localeCompare(a.activated_at))[0];$('#policyPill').textContent='Policy v'+(active?.version||'—')+' active';$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});({workspace,chat,suppliers,policy,data,audit}[page])();}
function workspace(){const r=run(),gs=r?.requirements||[],po=gs.filter(g=>g.decision==='PO'),sourcing=gs.filter(g=>g.decision==='SOURCING_REQUEST'),pending=gs.filter(g=>!r.actions[g.group_id]);$('#content').innerHTML=heading('A clearer path to every purchase.','Review requirements, understand the why, and keep procurement moving.',`<button class="btn" id="batchBtn">↥ &nbsp; Upload PR batch</button><button class="btn primary" data-go="chat">＋ New request</button>`)+`<div class="stats"><div class="stat"><div class="stat-top">Total requirements <span>▦</span></div><strong>${gs.length}</strong><small>${r?.rows.length||0} purchase request lines</small></div><div class="stat"><div class="stat-top">Ready for purchase order <span>↗</span></div><strong>${po.length}</strong><small class="green">${r?.pos.length||0} consolidated purchase orders</small></div><div class="stat"><div class="stat-top">Sourcing required <span>♧</span></div><strong>${sourcing.length}</strong><small>Find the right supplier, at the right price</small></div><div class="stat"><div class="stat-top">Total requirement value <span>₹</span></div><strong style="font-size:26px">${money(gs.reduce((s,g)=>s+g.group_value_inr,0))}</strong><small>Excluding GST · before approval</small></div></div>`+(r?.invalid?`<div class="notice">${r.invalid} invalid lines were not processed. Their reasons are included in the CSV export.</div>`:'')+`<div class="grid"><div class="card"><div class="cardhead"><div><h2>Requirements</h2><small>${pending.length} awaiting your review</small></div>${r?`<select id="runSelect" class="runselect" aria-label="Select processing run">${state.runs.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${esc(x.label)} · ${x.id}</option>`).join('')}</select>`:''}</div><div class="tabs"><div class="tabgroup"><button class="tab ${filter==='all'?'selected':''}" data-filter="all">All requirements</button><button class="tab ${filter==='PO'?'selected':''}" data-filter="PO">Purchase orders</button><button class="tab ${filter==='SOURCING_REQUEST'?'selected':''}" data-filter="SOURCING_REQUEST">Sourcing</button></div><input id="search" placeholder="⌕ Search requirements" aria-label="Search requirements" value="${esc(query)}"></div><div id="reqTable"></div><div class="cardfoot"><span>${gs.length} requirements · ${r?new Date(r.at).toLocaleString('en-IN'):'No batch processed yet'}</span>${r?`<a href="/api/export?run=${r.id}" style="color:#557641;text-decoration:none">↓ Export decisions</a>`:'<span>Ready when you are</span>'}</div></div><div class="rightcol"><div class="card newrequest"><div class="symbol">☷</div><h2>Start with a conversation.</h2><p>Tell us what you need. We’ll find the item, ask the right questions, and handle the policy.</p><button class="btn primary" data-go="chat">Create a purchase request &nbsp; ↗</button></div><div class="card policycard"><div class="sectionlabel">YOUR POLICY, IN PRACTICE</div><h3>Procurement policy</h3><p class="sub">Version ${esc(activePolicy().version)} · effective ${esc(activePolicy().effective_date)}</p><div class="policyrow"><span>Rules applied</span><b>${activePolicy().rules.length} ordered rules</b></div><div class="policyrow"><span>Clubbing window</span><b>${activePolicy().clubbing_days} days</b></div><div class="policyrow"><span>Policy updates</span><span class="badge">APPROVAL REQUIRED</span></div><button class="btn" data-go="policy">View policy &nbsp; →</button></div></div></div><div class="card activity"><div class="cardhead"><h2>Recent activity</h2><button class="view" data-go="audit">View all ↗</button></div><div class="activitylist">${state.audit.slice(-3).reverse().map(a=>`<div class="activityitem"><div class="dot"></div><div>${esc(a.action.replaceAll('_',' ').toLowerCase())}<small>${esc(typeof a.detail==='string'?a.detail:JSON.stringify(a.detail))} · ${new Date(a.at).toLocaleString('en-IN')}</small></div></div>`).join('')||'<p class="sub">Your workspace activity will appear here.</p>'}</div></div>`;renderTable();$('#search').oninput=e=>{query=e.target.value;renderTable()};$('#batchBtn').onclick=batchModal;$('#runSelect')?.addEventListener('change',e=>{selectedRun=e.target.value;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;workspace();bindGo()});bindGo()}
function activePolicy(){return state.policies.at(-1)}
function renderTable(){const r=run(),gs=(r?.requirements||[]).filter(g=>(filter==='all'||g.decision===filter)&&JSON.stringify(g).toLowerCase().includes(query.toLowerCase()));$('#reqTable').innerHTML=gs.length?`<div class="tablewrap"><table><thead><tr><th>REQUIREMENT / ITEM</th><th>PLANT</th><th>VALUE</th><th>ROUTE</th><th>STATUS</th><th></th></tr></thead><tbody>${gs.map(g=>`<tr><td><strong>${esc(g.description)}</strong><small>${g.group_id} · ${g.lines.length} PR line${g.lines.length>1?'s':''} · ${esc(g.resolved_item_code)}</small></td><td>${esc(g.plant)}</td><td>${money(g.group_value_inr)}</td><td>${badge(g.route)}</td><td><span class="badge ${r.actions[g.group_id]?'':'gray'}">${r.actions[g.group_id]?'APPROVED':'TO REVIEW'}</span></td><td><button class="view" data-detail="${g.group_id}" aria-label="Review ${g.group_id}">↗</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div style="font-size:32px;color:#aabd90">▱</div><h3>${r?'No matching requirements':'Your next purchase starts here.'}</h3><p>${r?'Try another search or filter.':'Import the kit data, then upload a PR batch or start a conversation to see policy-backed decisions.'}</p>${!r?'<button class="btn primary" data-go="data">Set up your data →</button>':''}</div>`;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));bindGo()}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>change(b.dataset.go))}
function showModal(html){$('#modal').innerHTML=`<div class="bodypad"><button class="close" aria-label="Close dialog">×</button>${html}</div>`;$('#modal .close').onclick=()=>$('#modal').close();$('#modal').showModal()}
function batchModal(){showModal(`<h2>Process a PR batch</h2><p class="sub">Upload a CSV in the supplied format. Runs are preserved separately for comparison.</p><div class="upload"><input type="file" id="batchFile" accept=".csv" aria-label="PR batch CSV"></div><label>Policy version <select id="batchPolicy"><option value="">Effective on each requirement date</option>${state.policies.map(p=>`<option>${esc(p.version)}</option>`).join('')}</select></label><p class="sub" style="margin:14px 0">Use an explicit version for blind-test Run 1 / Run 2. A run simulates contract consumption from the imported register.</p><button class="btn primary" id="process">Process batch →</button>`);$('#process').onclick=()=>safe(async()=>{const f=$('#batchFile').files[0];if(!f)throw Error('Choose a CSV file');const r=await api('process-batch',{csv:await f.text(),policy_version:$('#batchPolicy').value,label:f.name});selectedRun=r.id;$('#modal').close();await refresh();toast('Processed '+r.rows.length+' PR lines')})}
function detail(id){const r=run(),g=r.requirements.find(g=>g.group_id===id),a=r.actions[id];showModal(`<div class="eyebrow">${g.group_id} · POLICY ${esc(g.policy_version)}</div><h2>${esc(g.description)}</h2><div class="detail-grid"><div><small>Routing decision</small>${badge(g.route)}</div><div><small>Requirement value</small>${money(g.group_value_inr)}</div><div><small>Total quantity · plant</small>${g.quantity} · ${esc(g.plant)}</div><div><small>Supplier</small>${esc(g.supplier_id||g.suggested_supplier_ids||'Buyer to identify')}</div><div><small>PO unit price</small>${g.unit_price?money(g.unit_price):'Sourcing required'}</div><div><small>Consolidated PO</small>${esc(g.po_id||'—')}</div></div><p class="detail-reason">${esc(g.reason)}</p><h3>Included purchase requests</h3><div class="tablewrap"><table><thead><tr><th>PR / LINE</th><th>CREATED</th><th>QUANTITY</th><th>NEED BY</th><th>URGENCY</th></tr></thead><tbody>${g.lines.map(l=>`<tr><td>${esc(l.pr_no)}/${esc(l.pr_line)}</td><td>${esc(l.created_at)}</td><td>${esc(l.quantity)}</td><td>${esc(l.need_by_date)}</td><td>${esc(l.urgency)}</td></tr>`).join('')}</tbody></table></div>${a?`<div class="notice">${esc(a.action)} · ${esc(a.document_id)} · ${new Date(a.at).toLocaleString('en-IN')}<br>${esc(a.comment)}</div>`:`<div class="actions"><button class="btn primary" id="approve">Approve & create ${g.decision==='PO'?'PO':'sourcing request'}</button><button class="btn" id="overrideToggle">Override with a reason</button></div><div id="overrideForm" class="hidden" style="margin-top:20px"><select id="overrideRoute"><option>RFQ</option><option>RFP</option><option>CAPEX_SOURCING</option><option>NEW_ITEM_SOURCING</option></select><p class="sub">Overrides can move to sourcing. Direct PO changes require a reviewed policy update.</p><textarea id="overrideReason" placeholder="Explain your decision" style="margin-top:12px"></textarea><button class="btn primary" id="overrideSave">Save override</button></div>`}`);if(!a){$('#approve').onclick=()=>action('approve');$('#overrideToggle').onclick=()=>$('#overrideForm').classList.toggle('hidden');$('#overrideSave').onclick=()=>action('override')}function action(action){safe(async()=>{await api('action',{run_id:r.id,group_id:id,action,comment:$('#overrideReason')?.value,route:$('#overrideRoute')?.value});$('#modal').close();await refresh();toast(action==='approve'?'Approval recorded and document created':'Override saved with original decision')})}}
function chat(){$('#content').innerHTML=heading('Good procurement starts with a chat.','Describe what you need. We’ll help turn it into a complete purchase request.')+`<div class="card chat-shell"><div class="cardhead"><h2>Purchase assistant</h2><span class="badge">POLICY CONNECTED</span></div><div class="messages" id="messages">${[{role:'assistant',text:'Hello! What do you need to purchase? Try “need 200 ITM-1048 for Chakan by 2026-11-27, Normal”.'},...state.chat].map(m=>`<div class="message ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><form class="chat-input" id="chatForm"><input id="chatText" placeholder="Tell us what you need…" autocomplete="off" aria-label="Message to purchase assistant"><button class="btn primary">Send ↗</button></form><div class="hint">Use item codes for a precise match. Unknown items are routed to sourcing; nothing is ordered until buyer approval.</div></div>`;$('#messages').scrollTop=$('#messages').scrollHeight;$('#chatForm').onsubmit=e=>{e.preventDefault();safe(async()=>{const text=$('#chatText').value;if(!text.trim())return;const r=await api('chat',{text,draft:chatDraft});chatDraft=r.draft;await refresh();$('#chatText').focus()})}}
async function suppliers(){$('#content').innerHTML=heading('A better starting point for suppliers.','Ranked from purchase history, contract experience, delivery and quality.')+`<div class="card"><div class="cardhead"><h2>Preferred supplier list</h2><div style="display:flex;gap:10px"><input type="date" id="asof" value="${new Date().toISOString().slice(0,10)}" aria-label="Supplier ranking as of date"><button class="btn primary" id="loadSuppliers">Calculate</button><a class="btn" id="supplierExport">↓ Export top 3</a></div></div><div class="bodypad"><p class="sub">Active suppliers only · per-item top three · reference prices use the supplier’s latest eligible PO, then its most recent contract.</p></div><div id="supplierTable"></div></div>`;$('#loadSuppliers').onclick=()=>safe(load);await safe(load);async function load(){const asof=$('#asof').value;const rows=await api('preferred?asof='+asof);$('#supplierExport').href='/api/preferred?csv=1&asof='+asof;$('#supplierTable').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>ITEM</th><th>RANK</th><th>SUPPLIER</th><th>REFERENCE PRICE</th><th>SCORE</th><th>WHY THIS RANK</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.item_code)}</td><td><span class="badge">#${s.rank}</span></td><td><strong>${esc(s.name)}</strong><small>${esc(s.supplier_id)}</small></td><td>${money(s.reference_price)}</td><td>${s.score}</td><td>${esc(s.explanation)}<small>${esc(s.reference)}</small></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No eligible suppliers yet</h3><p>Import masters, history and contracts in Data library.</p></div>'}}
function policy(){$('#content').innerHTML=heading('Policy changes. Your code doesn’t.','Draft a change, review the exact rules, then activate a dated version.')+`<div class="notice">Rules run from top to bottom; the first match wins. Upload JSON, a text/PDF amendment, or describe a supported change. Review the draft before activation.</div><div class="versions">${state.policies.map(p=>`<div class="version"><b>Version ${esc(p.version)}</b>Effective ${esc(p.effective_date)}</div>`).join('')}</div><div class="split"><div class="card"><div class="cardhead"><h2>Describe a policy change</h2></div><div class="bodypad"><textarea id="amendment" placeholder="Version 5.1&#10;Effective 2026-11-01&#10;Spot PO limit 300000&#10;For plant CHK1, above INR 100000 use RFQ"></textarea><div class="upload"><input type="file" id="policyFile" accept=".pdf,.txt,.json" aria-label="Policy amendment file"></div><button class="btn primary" id="draftPolicy">Preview changes →</button><p class="sub" style="margin-top:18px">Supported chat changes: value limits, clubbing and consolidation windows, and plant/category rules. Complex changes can be expressed in the JSON editor. Unsupported text is rejected for review.</p></div></div><div class="card"><div class="cardhead"><h2>${state.draft?'Review draft':'Structured policy editor'}</h2><span class="badge ${state.draft?'amber':'gray'}">${state.draft?'DRAFT · NOT ACTIVE':'CURRENT VERSION'}</span></div><div class="bodypad">${state.draft?`<p class="sub">${state.draft.summary.map(esc).join('<br>')}</p>`:''}<textarea id="policyJSON" class="editor" aria-label="Policy JSON">${esc(JSON.stringify(state.draft?.policy||activePolicy(),null,2))}</textarea><div class="actions"><button class="btn" id="saveJSON">Validate & preview JSON</button>${state.draft?'<button class="btn primary" id="activatePolicy">Approve & activate</button>':''}</div></div></div></div>`;$('#draftPolicy').onclick=()=>safe(async()=>{const f=$('#policyFile').files[0],text=f?await readDocument(f):$('#amendment').value;await api('policy/draft',{text});await refresh();toast('Draft ready for review')});$('#saveJSON').onclick=()=>safe(async()=>{await api('policy/draft',{policy:JSON.parse($('#policyJSON').value)});await refresh();toast('Draft validated')});$('#activatePolicy')?.addEventListener('click',()=>safe(async()=>{if(JSON.stringify(JSON.parse($('#policyJSON').value))!==JSON.stringify(state.draft.policy))throw Error('Validate your edited JSON before activating it');await api('policy/activate',{});await refresh();toast('Policy version activated')}))}
function data(){const d=state.data;$('#content').innerHTML=heading('The foundation of every decision.','Bring your masters, history and signed contracts into one place.')+`<div class="split"><div class="card"><div class="cardhead"><h2>Import reference data</h2><span class="badge">CSV</span></div><div class="bodypad"><p class="sub">Select the six CSV files from master_data and contracts: item_master, supplier_master, po_history, plants, contract_register and contract_lines.</p><div class="upload"><input type="file" multiple accept=".csv" id="dataFiles" aria-label="Reference CSV files"></div><button class="btn primary" id="importData">Import selected files →</button><div class="data-count">${Object.entries(d).map(([k,v])=>`<div><b>${v.length}</b><small>${esc(k.replace('contractLines','contract lines'))}</small></div>`).join('')}</div><p class="sub" style="margin-top:20px">Imports replace the selected dataset. Saved processing runs keep their original results. Task data is stored in the private database, separate from source code.</p></div></div><div class="card"><div class="cardhead"><h2>Add a signed contract</h2><span class="badge">PDF / JSON</span></div><div class="bodypad"><p class="sub">Add PDF-only contracts after importing the register. Existing register contracts keep their recorded consumption.</p><div class="upload"><input type="file" id="contractFile" accept=".pdf,.txt,.json" aria-label="Signed contract PDF"><button class="btn" id="parseContract" style="margin-top:15px">Extract for review</button></div><textarea id="contractJSON" class="editor" style="min-height:200px" placeholder='{"contract":{"contract_id":"…","supplier_id":"…","start_date":"2026-11-01","end_date":"2027-10-31","value_cap":1000000,"consumed_value":0},"lines":[{"item_code":"…","rate":100}]}' aria-label="Contract JSON">${draftContract?esc(JSON.stringify(draftContract,null,2)):''}</textarea><button class="btn primary" id="saveContract" style="margin-top:15px">Review & add contract</button></div></div></div><div class="card activity"><div class="cardhead"><h2>Contract register</h2><small>${d.contracts.length} contracts</small></div><div class="tablewrap"><table><thead><tr><th>CONTRACT</th><th>SUPPLIER</th><th>VALIDITY</th><th>VALUE CEILING</th><th>REGISTER CONSUMPTION</th></tr></thead><tbody>${d.contracts.map(c=>`<tr><td>${esc(c.contract_id)}</td><td>${esc(c.supplier_id)}</td><td>${esc(c.start_date)} — ${esc(c.end_date)}</td><td>${money(c.value_cap)}</td><td>${money(c.consumed_value)}</td></tr>`).join('')}</tbody></table></div></div>`;$('#importData').onclick=()=>safe(async()=>{const files=await Promise.all([...$('#dataFiles').files].map(async f=>({name:f.name,text:await f.text()})));if(!files.length)throw Error('Select CSV files');await api('import',{files});await refresh();toast('Reference data imported')});$('#parseContract').onclick=()=>safe(async()=>{const f=$('#contractFile').files[0];if(!f)throw Error('Choose a contract file');const text=await readDocument(f);draftContract=f.name.endsWith('.json')?JSON.parse(text):await api('contracts/parse',{text});$('#contractJSON').value=JSON.stringify(draftContract,null,2);toast('Extraction ready. Check dates, ceiling and rates before adding.')});$('#saveContract').onclick=()=>safe(async()=>{const b=JSON.parse($('#contractJSON').value);await api('contracts',b);draftContract=null;await refresh();toast('Signed contract added')})}
function audit(){$('#content').innerHTML=heading('A record you can stand behind.','Policy changes, imports, approvals and overrides — with who, when and why.')+`<div class="card"><div class="cardhead"><h2>Workspace activity</h2><small>${state.audit.length} events</small></div><div class="tablewrap"><table><thead><tr><th>WHEN</th><th>ACTION</th><th>WHO</th><th>DETAIL</th></tr></thead><tbody>${[...state.audit].reverse().map(a=>`<tr><td>${new Date(a.at).toLocaleString('en-IN')}</td><td>${esc(a.action)}</td><td>${esc(a.actor)}</td><td style="white-space:normal">${esc(typeof a.detail==='string'?a.detail:JSON.stringify(a.detail))}</td></tr>`).join('')}</tbody></table></div></div>`}
async function readDocument(f){if(!f.name.toLowerCase().endsWith('.pdf'))return f.text();toast('Reading PDF…');const pdfjs=await import('/assets/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='/assets/pdf.worker.mjs';const pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer()),useSystemFonts:true,isEvalSupported:false}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();text+=content.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n';}return text;}
async function safe(fn){try{document.body.classList.add('busy');return await fn()}catch(e){toast(e.message,true)}finally{document.body.classList.remove('busy')}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>change(b.dataset.page));await safe(refresh);
</script></body></html>
